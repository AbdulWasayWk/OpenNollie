# Slow blue/purple breathing on all fans together, steady white GPU.
name = "Calm breathe"
fps = 30


[groups]
fans = "8,7,6,15,14,16,13,12,4,5"

[[layer]]
ports = "fans"
effect = "breathe"
colors = ["#0040ff", "#8000ff"]   # alternate each breath
period = 6
min = 0.15                        # never fully dark
brightness = 0.7

[[layer]]
ports = "9"
effect = "static"
color = "white"
brightness = 0.4
