# A rainbow that travels with the airflow: intake fans → GPU → CPU cooler → exhaust.
name = "Airflow rainbow"
fps = 30


[groups]
airflow = "8,7,6,15,14,16,9,13,12,4,5"

[[layer]]
ports = "airflow"
effect = "rainbow"
period = 10          # seconds for a full color cycle
spread = 1.0         # the group shows the whole rainbow at once
brightness = 0.6
